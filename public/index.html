<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>همیار درس</title>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;600;800&display=swap" rel="stylesheet">

<style>
:root{--bg:#5b3a8c;--card:#fff;--ink:#2a1e3d;--mut:#6b5f7d;--acc:#6a3fb5;--line:#ddd3ec;--bad:#c0392b;--ok:#1e8449}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Vazirmatn,Tahoma,Arial,sans-serif;line-height:1.9;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
main{max-width:760px;margin:auto;padding:14px}
header{display:flex;justify-content:space-between;align-items:center;gap:10px}
header select{width:auto;min-width:120px}
h1{font-size:1.5rem;font-weight:800;margin:8px 0 2px;color:#fff}
.sub{color:#e6dcf5;margin:0 0 12px}
main>p.mut{color:#e6dcf5}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;margin:10px 0}
label{display:block;font-weight:600;margin:8px 0 2px}
input,select,textarea,button{font:inherit;color:inherit}
input,select,textarea{width:100%;padding:8px;border:1px solid var(--line);border-radius:8px;background:#f6f2fb;color:var(--ink)}
.row{display:flex;gap:10px;flex-wrap:wrap}.row>*{flex:1;min-width:120px}
button{background:var(--acc);color:#fff;border:0;border-radius:8px;padding:9px 16px;cursor:pointer;font-weight:600;margin-top:10px;margin-inline-end:6px}
button.alt{background:transparent;color:var(--acc);border:1px solid var(--acc)}
button:disabled{opacity:.5}
nav{display:flex;gap:6px;overflow-x:auto;margin:10px 0;border-bottom:1px solid rgba(255,255,255,.35)}
nav button:focus-visible{outline-color:#fff}
nav button{background:none;color:#e6dcf5;border-radius:8px 8px 0 0;margin:0;padding:8px 12px;white-space:nowrap}
nav button.on{color:#fff;border-bottom:3px solid #fff}
.pane{display:none}.pane.on{display:block}
.out{white-space:pre-wrap}
.q{border-top:1px solid var(--line);padding:10px 0}
.opt{display:block;font-weight:400;margin:2px 0}.opt input{width:auto;margin-inline-end:6px}
.res{margin-top:6px;font-size:.95rem}.good{color:var(--ok)}.bad{color:var(--bad)}
.mut{color:var(--mut);font-size:.9rem}
#printArea{display:none}
@media print{body{background:#fff;color:#000;padding:0}main{display:none}#printArea{display:block}.pq{margin:0 0 14px;break-inside:avoid}.ln{border-bottom:1px solid #999;height:5em}}
:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
</style>
</head>

<main>
<header>

const t=(k,n)=>(T[S.lang][k]||T.en[k]||k).replace('{n}',n);

function applyLang(l){
  S.lang=l;
  document.documentElement.lang=l;document.documentElement.dir=l==='fa'?'rtl':'ltr';
  document.title=t('title');
  document.querySelectorAll('[data-i]').forEach(e=>e.textContent=t(e.dataset.i));
  document.querySelectorAll('[data-ph]').forEach(e=>e.placeholder=t(e.dataset.ph));
  $('info').textContent=S.pdf?t('loaded',S.pdf.numPages):t('nofile');
  document.querySelectorAll('.q button.alt').forEach(b=>b.textContent=t('check'));
  try{localStorage.setItem('lang',l)}catch(e){}
}
let saved='';try{saved=localStorage.getItem('lang')||''}catch(e){}
const nav2=(navigator.language||'en').slice(0,2);
const first=T[saved]?saved:(T[nav2]?nav2:'en');
$('lang').value=first;applyLang(first);
$('lang').onchange=e=>applyLang(e.target.value);

document.querySelectorAll('#tabs button').forEach(b=>b.onclick=()=>{
  document.querySelectorAll('#tabs button').forEach(x=>x.classList.toggle('on',x===b));
  document.querySelectorAll('.pane').forEach(p=>p.classList.toggle('on',p.id===b.dataset.t));
});

$('pick').onclick=()=>$('file').click();
$('file').onchange=async e=>{
  const f=e.target.files[0];if(!f)return;$('fname').textContent=f.name;
  $('info').textContent=t('loading');
  try{
    S.pdf=await pdfjsLib.getDocument({data:await f.arrayBuffer()}).promise;
    $('p2').value=1;$('p1').max=$('p2').max=S.pdf.numPages;
    $('info').textContent=t('loaded',S.pdf.numPages);
  }catch(err){$('info').textContent=t('readfail')+err.message}
};

async function pages(){
  if(!S.pdf)throw new Error(t('needFile'));
  const a=+$('p1').value,b=+$('p2').value;
  if(!a||!b||a>b||b>S.pdf.numPages)throw new Error(t('badRange'));
  if(b-a>14)throw new Error(t('max15'));
  let text='',imgs=[];
  for(let i=a;i<=b;i++){
    const pg=await S.pdf.getPage(i);
    const tx=(await pg.getTextContent()).items.map(x=>x.str).join(' ').trim();
    if(tx.length>40)text+=`\n[Page ${i}]\n`+tx;
    else{
      const vp=pg.getViewport({scale:1.3}),c=document.createElement('canvas');
      c.width=vp.width;c.height=vp.height;
      await pg.render({canvasContext:c.getContext('2d'),viewport:vp}).promise;
      imgs.push(c.toDataURL('image/jpeg',.7).split(',')[1]);
    }
  }
  return{text,imgs};
}

async function ask(prompt,{imgs=[],search=false}={}){
  const system=`You are an educational assistant for students. Base your answers on the provided content. The textbook may be in any language. Always write your entire response in ${LN[S.lang]}.`;
  const body={systemInstruction:system,prompt,imgs,search};
  const r=await fetch('/api/ask',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(body)});
  const j=await r.json();
  if(r.status===429)throw new Error(t('quota'));
  if(!r.ok)throw new Error(j.error||t('apiErr'));
  let out=j.text||'';
  if(search&&j.sources&&j.sources.length)out+='\n\n'+t('sources')+'\n'+[...new Set(j.sources)].join('\n');
  return out;
}

async function run(btn,fn){
  const old=btn.textContent;btn.disabled=true;btn.textContent=t('busy');
  try{await fn()}catch(e){alert(e.message)}
  btn.disabled=false;btn.textContent=old;
}

const TN={mcq:'multiple-choice (4 options)',essay:'essay (descriptive)',blank:'fill-in-the-blank'};

async function genQuiz(type,n,extra,out){
  const {text,imgs}=await pages();
  const p=`Lesson content:\n${text||'(in the attached images)'}\n\n${extra}\nCreate ${n} ${TN[type]} questions.
Return ONLY valid JSON with no other text: {"items":[{"q":"question text","options":["A","B","C","D"],"answer":"correct answer (for multiple-choice: the option number 1 to 4)","explain":"short explanation"}]}
For fill-in-the-blank, mark the blank with ____ and leave options empty. For essay, leave options empty and make answer a model answer.`;
  const raw=await ask(p,{imgs});
  const m=raw.match(/\{[\s\S]*\}/);
  if(!m)throw new Error(t('badJson'));
  let items;try{items=JSON.parse(m[0]).items}catch(e){throw new Error(t('badJson'))}
  render(items,type,out);
}

function render(items,type,box){
  box.innerHTML='';S.last[box.id]={items,type};
  items.forEach((it,i)=>{
    const d=document.createElement('div');d.className='q';
    const h=document.createElement('div');h.textContent=(i+1)+'. '+it.q;d.append(h);
    let get;
    if(type==='mcq'){
      const w=document.createElement('div');
      (it.options||[]).forEach((o,k)=>{
        const l=document.createElement('label');l.className='opt';
        const r=document.createElement('input');r.type='radio';r.name='q'+box.id+i;r.value=k+1;
        l.append(r,document.createTextNode(o));w.append(l);
      });
      d.append(w);get=()=>(w.querySelector('input:checked')||{}).value;
    }else{
      const x=type==='essay'?document.createElement('textarea'):document.createElement('input');
      if(type==='essay')x.rows=4;d.append(x);get=()=>x.value.trim();
    }
    const b=document.createElement('button');b.className='alt';b.textContent=t('check');
    const res=document.createElement('div');res.className='res';
    b.onclick=()=>run(b,async()=>{
      const v=get();if(!v){res.textContent=t('answerFirst');return}
      let ok;res.className='res';res.textContent='';
      if(type==='mcq')ok=String(v)===String(it.answer).trim().slice(0,1);
      else if(type==='blank')ok=v.toLowerCase().replace(/\s/g,'')===String(it.answer).toLowerCase().replace(/\s/g,'');
      else{
        const g=await ask(`Question: ${it.q}\nModel answer: ${it.answer}\nStudent answer: ${v}\nGrade the student answer out of 10 and give feedback in 2 to 3 sentences. The first line must contain only the numeric score.`);
        const sc=parseFloat(g);ok=sc>=7;
        res.className='res '+(ok?'good':'bad');res.textContent=g;
        if(!ok)S.wrong.push(it.q);return;
      }
      res.className='res '+(ok?'good':'bad');
      res.textContent=(ok?t('ok'):t('no'))+' '+t('ans')+it.answer+(it.explain?' — '+it.explain:'');
      if(!ok)S.wrong.push(it.q);
    });
    d.append(b,res);box.append(d);
  });
  box.querySelectorAll('button').forEach(x=>x.textContent=t('check'));
}

$('qgo').onclick=e=>run(e.target,()=>genQuiz($('qtype').value,$('qn').value,`Difficulty level: ${LV[$('qlv').value]}.`,$('qout')));

$('wgo').onclick=e=>run(e.target,async()=>{
  const {text}=await pages();
  const topic=$('wtopic').value.trim()||('the main topic of this text: '+text.slice(0,600));
  $('wout').textContent=await ask(`Search the web about "${topic}" and summarize supplementary material, practical examples and reliable sources. List the sources at the end.`,{search:true});
});

$('pgo').onclick=e=>run(e.target,()=>genQuiz($('ptype').value,$('pn').value,`Goal: reinforcement practice. ${$('ptopic').value?'Focus on this problem or topic: '+$('ptopic').value+'.':''} Vary the questions and go from easy to hard.`,$('pout')));
$('pweak').onclick=e=>run(e.target,()=>{
  if(!S.wrong.length)throw new Error(t('noWrong'));
  return genQuiz($('ptype').value,$('pn').value,'The student answered these questions wrongly: '+S.wrong.slice(-8).join(' | ')+'. Create new, similar questions that address these weaknesses.',$('pout'));
});

let chunks=[],idx=0,aud=null,playId=0;
function stopAll(){
  playId++;idx=chunks.length;
  if(window.speechSynthesis)speechSynthesis.cancel();
  if(aud){aud.pause();aud=null}
}
function voice(){
  if(S.lang==='fa'){$('avoice').textContent='';return null}
  if(!window.speechSynthesis){$('avoice').textContent=t('nospeech');return null}
  const v=speechSynthesis.getVoices().find(x=>x.lang.toLowerCase().startsWith(S.lang));
  $('avoice').textContent=v?'':t('novoice');return v;
}
function speak(){
  if(idx>=chunks.length||!window.speechSynthesis)return;
  const u=new SpeechSynthesisUtterance(chunks[idx++]);
  u.lang=VC[S.lang];u.rate=+$('arate').value;const v=voice();if(v)u.voice=v;
  u.onend=speak;speechSynthesis.speak(u);
}
function splitText(s,max){
  const sents=s.match(/[^.!؟?\n]+[.!؟?]?\s*/g)||[s];
  const out=[];let cur='';
  for(const x of sents){
    if((cur+x).length>max&&cur){out.push(cur);cur=x}else cur+=x;
  }
  if(cur.trim())out.push(cur);
  return out;
}
async function fetchTts(text){
  const r=await fetch('/api/tts',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({text})});
  if(!r.ok){
    let m='';try{m=(await r.json()).error}catch(e){}
    throw new Error(r.status===429?t('quota'):t('apiErr')+(m?' ('+String(m).slice(0,120)+')':''));
  }
  return URL.createObjectURL(await r.blob());
}
async function playPersian(script,myId){
  const parts=splitText(script,1800);
  let next=fetchTts(parts[0]);next.catch(()=>{});
  for(let i=0;i<parts.length;i++){
    $('avoice').textContent=t('ttsBusy');
    const url=await next;
    if(myId!==playId)return;
    if(i+1<parts.length){next=fetchTts(parts[i+1]);next.catch(()=>{})}
    $('avoice').textContent='';
    await new Promise((res,rej)=>{
      aud=new Audio(url);aud.playbackRate=+$('arate').value||1;
      aud.onended=res;aud.onerror=()=>rej(new Error(t('apiErr')));
      aud.play().catch(rej);
    });
    URL.revokeObjectURL(url);
    if(myId!==playId)return;
  }
}
$('ago').onclick=e=>run(e.target,async()=>{
  stopAll();
  const myId=playId;
  const {text,imgs}=await pages();
  const mode=$('amode').value,topic=$('atopic').value.trim();
  const goal={page:'this page',chapter:'this chapter',problem:'this problem: '+topic}[mode];
  const script=await ask(`Lesson content:\n${text||'(in the attached images)'}\n\nTeach ${goal} step by step in simple words, like a patient teacher. The text will be read aloud: no bullet points, no asterisks or symbols, short sentences, and one example. End with two review questions.`,{imgs});
  $('aout').textContent=script;
  if(S.lang==='fa'){
    playPersian(script,myId).catch(err=>{if(myId===playId)$('avoice').textContent=err.message});
    return;
  }
  chunks=script.match(/[^.!؟?\n]+[.!؟?]?[^\n]*|^[^\n]+/g)||[script];idx=0;speak();
});
$('apause').onclick=()=>{
  if(aud){aud.paused?aud.play():aud.pause();return}
  if(!window.speechSynthesis)return;
  speechSynthesis.paused?speechSynthesis.resume():speechSynthesis.pause();
};
$('astop').onclick=()=>{stopAll();$('avoice').textContent=''};
if(window.speechSynthesis)speechSynthesis.onvoiceschanged=voice;

function exportPdf(id){
  const tk={qout:'tq',wout:'tw',pout:'tp',aout:'ta'}[id];
  const pa=$('printArea');pa.innerHTML='';
  const h=document.createElement('h2');h.textContent=t('title')+' — '+t(tk);pa.append(h);
  if(id==='qout'||id==='pout'){
    const L=S.last[id];if(!L||!L.items.length){alert(t('pdfNone'));return}
    L.items.forEach((it,i)=>{
      const d=document.createElement('div');d.className='pq';
      const q=document.createElement('p');q.textContent=(i+1)+'. '+it.q;d.append(q);
      if(L.type==='mcq')(it.options||[]).forEach((o,k)=>{const p=document.createElement('div');p.textContent=(k+1)+') '+o;d.append(p)});
      else{const ln=document.createElement('div');ln.className='ln';d.append(ln)}
      pa.append(d);
    });
    const k=document.createElement('h3');k.textContent=t('pdfKey');pa.append(k);
    L.items.forEach((it,i)=>{
      let a=String(it.answer);
      if(L.type==='mcq'){const o=(it.options||[])[parseInt(a)-1];if(o)a=parseInt(a)+') '+o}
      const p=document.createElement('div');p.textContent=(i+1)+'. '+a+(it.explain?' — '+it.explain:'');pa.append(p);
    });
  }else{
    const txt=$(id).textContent.trim();if(!txt){alert(t('pdfNone'));return}
    const p=document.createElement('div');p.className='out';p.textContent=txt;pa.append(p);
  }
  document.title=t('title')+' - '+t(tk);
  window.print();
}
window.onafterprint=()=>{document.title=t('title')};
document.querySelectorAll('[data-pdf]').forEach(b=>b.onclick=()=>exportPdf(b.dataset.pdf));
</script>
